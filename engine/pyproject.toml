[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shelter-engine"
version = "0.2.0"
description = "Layer 2 simulation and design-search engine for passive solar shelters"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "pydantic>=2.6,<3",
    "eppy>=0.5.63",
    "pymoo>=0.6.1,<0.7",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
mesh = ["trimesh>=4"]
cfd = ["gmsh>=4.13", "ansys-fluent-core>=0.42,<0.43"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shelter_engine = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:shelter_engine.*"]
