substitutions:
  _REGION: asia-south1
  _REPO: shelter
  _SERVICE: entropy-zero
  _AUTH: no-allow-unauthenticated
  _OPERATE_AT: "18:00"

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 3600s

steps:
  - id: repository
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - >-
        gcloud artifacts repositories describe ${_REPO} --location=${_REGION} >/dev/null 2>&1
        || gcloud artifacts repositories create ${_REPO} --location=${_REGION}
        --repository-format=docker --description="Entropy Zero images"

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.cloudrun
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --execution-environment=gen2
      - --cpu=2
      - --memory=4Gi
      - --no-cpu-throttling
      - --min-instances=1
      - --max-instances=1
      - --concurrency=20
      - --timeout=3600
      - --port=8080
      - --set-env-vars=SHELTER_OPERATE_AT=${_OPERATE_AT},SHELTER_OPERATE_LANG=en
      - --${_AUTH}

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
